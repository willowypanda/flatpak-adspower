name: Upload reusable Flatpak application repository

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      app_dir:
        required: true
        type: string
      app_id:
        required: true
        type: string
      app_name:
        required: true
        type: string
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
      R2_PUBLIC_URL:
        required: true
      FLATPAK_GPG_PRIVATE_KEY:
        required: true
      FLATPAK_GPG_KEY_ID:
        required: true
      FLATPAK_GPG_PASSPHRASE:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download application OSTree artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: new-repo
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Install AWS CLI and GnuPG
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak python3 python3-pip gnupg
          python3 -m pip install --user --break-system-packages awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          printf '%s\n' "${FLATPAK_GPG_PRIVATE_KEY}" | /usr/bin/gpg --batch --import
          PASSFILE="${RUNNER_TEMP}/gpg-passphrase"
          umask 077
          printf '%s' "${FLATPAK_GPG_PASSPHRASE}" > "${PASSFILE}"
          printf '%s\n' 'pinentry-mode loopback' "passphrase-file ${PASSFILE}" > "${GNUPGHOME}/gpg.conf"
          WRAPDIR="${RUNNER_TEMP}/gpg-bin"
          mkdir -m 700 -p "${WRAPDIR}"
          cat > "${WRAPDIR}/gpg" <<'EOF'
          #!/bin/sh
          exec /usr/bin/gpg --batch --pinentry-mode loopback --passphrase-file "${GPG_PASSPHRASE_FILE}" "$@"
          EOF
          chmod 700 "${WRAPDIR}/gpg"
          ln -s gpg "${WRAPDIR}/gpg2"
          echo "GPG_PASSPHRASE_FILE=${PASSFILE}" >> "$GITHUB_ENV"
          echo "PATH=${WRAPDIR}:$PATH" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY_ID=${FLATPAK_GPG_KEY_ID}" >> "$GITHUB_ENV"
          GPG_PUBLIC_KEY_B64="$(/usr/bin/gpg --homedir "${GNUPGHOME}" --batch --export "${FLATPAK_GPG_KEY_ID}" | base64 -w0)"
          echo "FLATPAK_GPG_PUBLIC_KEY_B64=${GPG_PUBLIC_KEY_B64}" >> "$GITHUB_ENV"

      - name: Download existing shared repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p existing repo
          aws s3 sync "s3://${R2_BUCKET}/" existing/ --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
          cp -a existing/. repo/ 2>/dev/null || true
          cp -a new-repo/. repo/

      - name: Sign shared OSTree repository
        run: |
          flatpak build-update-repo repo \
            --title='willowypanda-custom-flathub' \
            --comment='Custom Flatpak repository' \
            --gpg-sign="${FLATPAK_GPG_KEY_ID}"

      - name: Add shared repository metadata
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          printf '%s\n' '[Flatpak Repo]' \
            'Title=willowypanda-custom-flathub' \
            "Url=${R2_PUBLIC_URL%/}" \
            "Homepage=${R2_PUBLIC_URL%/}" \
            'Comment=Custom Flatpak repository' \
            'Description=Flatpak applications published by willowypanda' \
            "GPGKey=${FLATPAK_GPG_PUBLIC_KEY_B64}" > repo/willowypanda-custom-flathub.flatpakrepo

      - name: Publish shared repository to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 sync repo/ "s3://${R2_BUCKET}/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
          aws s3 cp repo/summary "s3://${R2_BUCKET}/summary" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --content-type application/octet-stream
          aws s3 cp repo/summary.sig "s3://${R2_BUCKET}/summary.sig" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --content-type application/pgp-signature
          aws s3 cp repo/willowypanda-custom-flathub.flatpakrepo "s3://${R2_BUCKET}/willowypanda-custom-flathub.flatpakrepo" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --content-type text/plain

      - name: Verify public shared repository
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -e
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error "${R2_PUBLIC_URL%/}/summary?verify=${attempt}" >/dev/null; then
              curl --fail --location --silent --show-error "${R2_PUBLIC_URL%/}/summary.sig?verify=${attempt}" >/dev/null
              echo "R2 shared summary and signature are publicly reachable"
              exit 0
            fi
            echo "summary not visible yet; retry ${attempt}/12"
            sleep 10
          done
          echo "R2 shared summary was not publicly reachable after retries" >&2
          exit 1

      - name: Publication summary
        run: |
          echo "Published ${{ inputs.app_name }} ${{ inputs.version }}-${{ inputs.revision }} to willowypanda-custom-flathub"
          echo "Remote: ${{ secrets.R2_PUBLIC_URL }}"
