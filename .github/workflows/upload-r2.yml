name: Upload Flatpak repository to Cloudflare R2

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
      R2_PUBLIC_URL:
        required: true
      FLATPAK_GPG_PRIVATE_KEY:
        required: true
      FLATPAK_GPG_KEY_ID:
        required: true
      FLATPAK_GPG_PASSPHRASE:
        required: true
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build workflow run ID
        required: true
        type: string
      version:
        description: AdsPower version
        required: true
        type: string
      revision:
        description: Packaging revision
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download OSTree artifact from build workflow
        uses: actions/download-artifact@v5
        with:
          name: ostree-repo
          path: repo
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Install AWS CLI and GnuPG
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak python3 python3-pip gnupg gnupg-utils
          python3 -m pip install --user --break-system-packages awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          printf '%s\n' "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --batch --import
          cat > "${GNUPGHOME}/gpg-agent.conf" <<EOF
          allow-preset-passphrase
          default-cache-ttl 7200
          max-cache-ttl 7200
          EOF
          gpgconf --homedir "${GNUPGHOME}" --launch gpg-agent
          PRESET="$(command -v gpg-preset-passphrase || find /usr/lib -type f -name gpg-preset-passphrase | head -1)"
          test -x "${PRESET}"
          while read -r KEYGRIP; do
            [ -z "${KEYGRIP}" ] || "${PRESET}" --homedir "${GNUPGHOME}" --preset "${KEYGRIP}" <<< "${FLATPAK_GPG_PASSPHRASE}"
          done < <(gpg --homedir "${GNUPGHOME}" --with-keygrip --list-secret-keys --with-colons "${FLATPAK_GPG_KEY_ID}" | awk -F: '$1 == "grp" {print $10}')
          echo "FLATPAK_GPG_KEY_ID=${FLATPAK_GPG_KEY_ID}" >> "$GITHUB_ENV"
          GPG_PUBLIC_KEY_B64="$(gpg --batch --export "${FLATPAK_GPG_KEY_ID}" | base64 -w0)"
          echo "FLATPAK_GPG_PUBLIC_KEY_B64=${GPG_PUBLIC_KEY_B64}" >> "$GITHUB_ENV"

      - name: Download existing R2 repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p existing
          aws s3 sync "s3://${R2_BUCKET}/" existing/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          cp -a existing/. repo/ 2>/dev/null || true

      - name: Sign merged OSTree repository
        run: |
          flatpak build-update-repo repo \
            --title='Shared Flatpak Repository' \
            --comment='Applications published to the shared repository' \
            --gpg-sign="${FLATPAK_GPG_KEY_ID}"

      - name: Add Flatpak repository metadata
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          printf '%s\n' '[Flatpak Repo]' \
            'Title=Shared Flatpak Repository' \
            "Url=${R2_PUBLIC_URL%/}" \
            "Homepage=${R2_PUBLIC_URL%/}" \
            'Comment=Shared Flatpak repository' \
            'Description=Applications published to the shared repository' \
            "GPGKey=${FLATPAK_GPG_PUBLIC_KEY_B64}" > repo/com.adspower.global.flatpakrepo

      - name: Publish repository to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 sync repo/ "s3://${R2_BUCKET}/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --delete --no-progress

      - name: Verify public summary
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: curl --fail --location --silent --show-error "${R2_PUBLIC_URL%/}/summary" >/dev/null

      - name: Publication summary
        run: |
          echo "Published AdsPower ${{ inputs.version }}-${{ inputs.revision }} to R2"
          echo "Remote: ${{ secrets.R2_PUBLIC_URL }}"
