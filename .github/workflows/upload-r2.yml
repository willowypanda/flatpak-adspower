name: Upload Flatpak repository to Cloudflare R2

on:
  workflow_call:
    inputs:
      repo_artifact:
        required: true
        type: string
      caller_run_id:
        required: true
        type: string
      upstream_version:
        required: true
        type: string
      pkg_rev:
        required: true
        type: string
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
      R2_PUBLIC_URL:
        required: true
  workflow_dispatch:
    inputs:
      repo_run_id:
        description: Build workflow run ID containing the OSTree artifact
        required: true
        type: string
      repo_artifact:
        description: OSTree artifact name
        required: true
        type: string
      caller_run_id:
        description: Build workflow run ID containing the OSTree artifact
        required: true
        type: string
      upstream_version:
        required: true
        type: string
      pkg_rev:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OSTree artifact from calling run
        if: github.event_name == 'workflow_call'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.repo_artifact }}
          path: repo
          run-id: ${{ inputs.caller_run_id }}
          github-token: ${{ github.token }}

      - name: Download OSTree artifact from selected run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.repo_artifact }}
          path: repo
          run-id: ${{ inputs.repo_run_id }}
          github-token: ${{ github.token }}

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --user --break-system-packages awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add metadata flatpakrepo file
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          cat > repo/com.adspower.global.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Shared Flatpak Repository
          Url=${R2_PUBLIC_URL%/}
          Homepage=${R2_PUBLIC_URL%/}
          Comment=Shared Flatpak repository
          Description=Applications published to the shared repository
          GPGKey=
          EOF

      - name: Publish complete OSTree repository to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 sync repo/ "s3://${R2_BUCKET}/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --delete --no-progress

      - name: Verify public Flatpak summary
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          curl --fail --location --silent --show-error "${R2_PUBLIC_URL%/}/summary" >/dev/null
          echo "R2 Flatpak repository is reachable: ${R2_PUBLIC_URL}"

      - name: Show published refs
        run: find repo/refs -type f -maxdepth 5 -print 2>/dev/null || true

      - name: Write publication summary
        run: |
          echo "Published upstream version: ${{ inputs.upstream_version }}"
          echo "Published package revision: ${{ inputs.pkg_rev }}"
          echo "Repository: ${{ secrets.R2_PUBLIC_URL }}"

  