name: Build and release Flatpak

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Force a rebuild
        required: false
        default: 'false'
        type: boolean
      force_pkg_rev:
        description: Packaging revision override
        required: false
        default: ''
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'build-flatpak.sh'
      - 'download-latest.sh'
      - 'com.adspower.global.desktop'
      - 'com.adspower.global.metainfo.xml'
      - 'adspower_global-wrapper'
      - 'flathub.json'

permissions:
  contents: write
  actions: read

env:
  APP_ID: com.adspower.global

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      bundle_name: ${{ steps.version.outputs.bundle_name }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      pkg_rev: ${{ steps.version.outputs.pkg_rev }}
      repo_artifact: ${{ steps.version.outputs.repo_artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dpkg-dev curl python3 python3-pip
          python3 -m pip install --user --break-system-packages awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08

      - name: Download latest AdsPower .deb
        run: ./download-latest.sh

      - name: Determine package revision
        id: version
        env:
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
          FORCE_PKG_REV: ${{ inputs.force_pkg_rev || '' }}
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('deb_info.json'))['version'])")"
          EXISTING="$(git ls-remote --tags origin "refs/tags/v${VERSION}-*" 2>/dev/null | sed -nE 's#.*refs/tags/v[0-9.]+-([0-9]+)(\^\{\})?$#\1#' | sort -n | tail -1)"
          if [ -n "${FORCE_PKG_REV}" ]; then REV="${FORCE_PKG_REV}"; BUILD=true
          elif [ "${FORCE_BUILD}" = true ]; then REV=$(( ${EXISTING:-0} + 1 )); BUILD=true
          elif [ -n "${EXISTING}" ]; then REV="${EXISTING}"; BUILD=false
          else REV=1; BUILD=true; fi
          echo "upstream_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkg_rev=${REV}" >> "$GITHUB_OUTPUT"
          echo "should_release=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=adspower-global-${VERSION}-${REV}.flatpak" >> "$GITHUB_OUTPUT"
          echo "repo_artifact=flatpak-repo-${VERSION}-${REV}" >> "$GITHUB_OUTPUT"

      - name: Download existing shared R2 repository
        if: steps.version.outputs.should_release == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p repo
          aws s3 sync "s3://${R2_BUCKET}/" repo/ --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress || true

      - name: Build Flatpak OSTree repository
        if: steps.version.outputs.should_release == 'true'
        run: |
          ./build-flatpak.sh --no-bundle
          flatpak build-update-repo repo --title='Shared Flatpak Repository' --comment='Applications published to the shared repository'
          test -f repo/summary

      - name: Upload OSTree repository artifact
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.repo_artifact }}
          path: repo
          retention-days: 2

      - name: Create or update Git tag
        if: steps.version.outputs.should_release == 'true'
        env:
          TAG: v${{ steps.version.outputs.upstream_version }}-${{ steps.version.outputs.pkg_rev }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then echo "Tag exists"; else git tag -a "${TAG}" -m "Release ${TAG}" && git push origin "${TAG}"; fi

  upload-r2:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_release == 'true'
    uses: ./.github/workflows/upload-r2.yml
    with:
      repo_artifact: ${{ needs.check-and-build.outputs.repo_artifact }}
      upstream_version: ${{ needs.check-and-build.outputs.upstream_version }}
      pkg_rev: ${{ needs.check-and-build.outputs.pkg_rev }}
    secrets: inherit

  github-release:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check-and-build.outputs.repo_artifact }}
          path: repo
      - name: Create bundle and GitHub Release (optional)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.check-and-build.outputs.upstream_version }}-${{ needs.check-and-build.outputs.pkg_rev }}
          BUNDLE: ${{ needs.check-and-build.outputs.bundle_name }}
        run: |
          timeout 20m flatpak build-bundle repo "${BUNDLE}" com.adspower.global
          if gh release view "${TAG}" >/dev/null 2>&1; then gh release upload "${TAG}" "${BUNDLE}" --clobber; else gh release create "${TAG}" "${BUNDLE}" --title "AdsPower Global ${{ needs.check-and-build.outputs.upstream_version }} (pkg ${{ needs.check-and-build.outputs.pkg_rev }})" --generate-notes; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-and-build.outputs.bundle_name }}
          path: ${{ needs.check-and-build.outputs.bundle_name }}
          retention-days: 2
          if-no-files-found: ignore

