name: Build AdsPower Flatpak release

on:
  workflow_call:
    inputs:
      force_build:
        required: false
        type: boolean
        default: false
    outputs:
      publish:
        value: ${{ jobs.build.outputs.publish }}
      version:
        value: ${{ jobs.build.outputs.version }}
      revision:
        value: ${{ jobs.build.outputs.revision }}
    secrets:
      FLATPAK_GPG_PRIVATE_KEY:
        required: true
      FLATPAK_GPG_KEY_ID:
        required: true
  workflow_dispatch:
    inputs:
      force_build:
        description: Force a rebuild
        required: false
        default: false
        type: boolean
      force_pkg_rev:
        description: Packaging revision override
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      bundle: ${{ steps.version.outputs.bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dpkg-dev curl python3 python3-pip
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Import Flatpak signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          sudo apt-get install -y gnupg
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          printf '%s\n' "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --batch --list-secret-keys "${FLATPAK_GPG_KEY_ID}"
          echo "FLATPAK_GPG_KEY_ID=${FLATPAK_GPG_KEY_ID}" >> "$GITHUB_ENV"
          gpg --batch --export "${FLATPAK_GPG_KEY_ID}" | base64 -w0 > "${RUNNER_TEMP}/gpg-public-key.b64"
          echo "FLATPAK_GPG_PUBLIC_KEY_B64=$(cat "${RUNNER_TEMP}/gpg-public-key.b64")" >> "$GITHUB_ENV"

      - name: Download latest AdsPower package
        run: ./download-latest.sh

      - name: Determine version and package revision
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json; print(json.load(open('deb_info.json'))['version'])")"
          EXISTING="$(git ls-remote --tags origin "refs/tags/v${VERSION}-*" 2>/dev/null | sed -nE 's#.*refs/tags/v[0-9.]+-([0-9]+)(\^\{\})?$#\1#' | sort -n | tail -1)"
          FORCE="${{ inputs.force_build || 'false' }}"
          if [ "${FORCE}" = true ]; then
            REV=$(( ${EXISTING:-0} + 1 ))
            PUBLISH=true
          elif [ -n "${EXISTING}" ]; then
            REV="${EXISTING}"
            PUBLISH=false
          else
            REV=1
            PUBLISH=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "bundle=adspower-global-${VERSION}-${REV}.flatpak" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\nversion=%s\nrevision=%s\nbundle=adspower-global-%s-%s.flatpak\n' \
            "${PUBLISH}" "${VERSION}" "${REV}" "${VERSION}" "${REV}" > build-result.txt

      - name: Build Flatpak OSTree repository
        if: steps.version.outputs.publish == 'true'
        run: |
          ./build-flatpak.sh --no-bundle
          flatpak build-update-repo repo \
            --title='Shared Flatpak Repository' \
            --comment='Applications published to the shared repository' \
            --gpg-sign="${FLATPAK_GPG_KEY_ID}"
          test -s repo/summary

      - name: Create Git tag
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.revision }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag already exists"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release and upload bundle
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.revision }}
          BUNDLE: ${{ steps.version.outputs.bundle }}
        run: |
          timeout 30m flatpak build-bundle --gpg-sign="${FLATPAK_GPG_KEY_ID}" repo "${BUNDLE}" com.adspower.global
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${BUNDLE}" --clobber
          else
            gh release create "${TAG}" "${BUNDLE}" \
              --title "AdsPower Global ${{ steps.version.outputs.version }} (pkg ${{ steps.version.outputs.revision }})" \
              --generate-notes
          fi

      - name: Upload build result
        uses: actions/upload-artifact@v5
        with:
          name: build-result
          path: build-result.txt
          retention-days: 3

      - name: Upload OSTree repository for R2 workflow
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ostree-repo
          path: repo
          retention-days: 3
          if-no-files-found: error

  