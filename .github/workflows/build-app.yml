name: Build reusable Flatpak application

on:
  workflow_call:
    inputs:
      app_dir:
        required: true
        type: string
      app_id:
        required: true
        type: string
      app_name:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string
      bundle_prefix:
        required: true
        type: string
      force_build:
        required: false
        type: boolean
        default: false
    outputs:
      publish:
        value: ${{ jobs.build.outputs.publish }}
      version:
        value: ${{ jobs.build.outputs.version }}
      revision:
        value: ${{ jobs.build.outputs.revision }}
      bundle:
        value: ${{ jobs.build.outputs.bundle }}
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
    secrets:
      FLATPAK_GPG_PRIVATE_KEY:
        required: true
      FLATPAK_GPG_KEY_ID:
        required: true
      FLATPAK_GPG_PASSPHRASE:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      bundle: ${{ steps.version.outputs.bundle }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dpkg-dev curl python3 python3-pip
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Import Flatpak signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          sudo apt-get install -y gnupg
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          printf '%s\n' "${FLATPAK_GPG_PRIVATE_KEY}" | /usr/bin/gpg --batch --import
          PASSFILE="${RUNNER_TEMP}/gpg-passphrase"
          umask 077
          printf '%s' "${FLATPAK_GPG_PASSPHRASE}" > "${PASSFILE}"
          printf '%s\n' 'pinentry-mode loopback' "passphrase-file ${PASSFILE}" > "${GNUPGHOME}/gpg.conf"
          WRAPDIR="${RUNNER_TEMP}/gpg-bin"
          mkdir -m 700 -p "${WRAPDIR}"
          cat > "${WRAPDIR}/gpg" <<'EOF'
          #!/bin/sh
          exec /usr/bin/gpg --batch --pinentry-mode loopback --passphrase-file "${GPG_PASSPHRASE_FILE}" "$@"
          EOF
          chmod 700 "${WRAPDIR}/gpg"
          ln -s gpg "${WRAPDIR}/gpg2"
          echo "GPG_PASSPHRASE_FILE=${PASSFILE}" >> "$GITHUB_ENV"
          echo "PATH=${WRAPDIR}:$PATH" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY_ID=${FLATPAK_GPG_KEY_ID}" >> "$GITHUB_ENV"

      - name: Download application package
        run: ./${{ inputs.app_dir }}/download-latest.sh

      - name: Determine version and package revision
        id: version
        env:
          APP_DIR: ${{ inputs.app_dir }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          BUNDLE_PREFIX: ${{ inputs.bundle_prefix }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json; print(json.load(open('${APP_DIR}/deb_info.json'))['version'])")"
          EXISTING=0
          while read -r REF; do
            TAG="${REF##*/}"
            case "${TAG}" in
              "${TAG_PREFIX}-v${VERSION}-"*)
                REV_CANDIDATE="${TAG##*-}"
                if [[ "${REV_CANDIDATE}" =~ ^[0-9]+$ ]] && [ "${REV_CANDIDATE}" -gt "${EXISTING}" ]; then
                  EXISTING="${REV_CANDIDATE}"
                fi
                ;;
            esac
          done < <(git ls-remote --tags origin "refs/tags/${TAG_PREFIX}-v${VERSION}-*" 2>/dev/null | awk '{print $2}')
          if [ "${FORCE_BUILD}" = true ]; then
            REV=$(( EXISTING + 1 ))
            PUBLISH=true
          elif [ "${EXISTING}" -gt 0 ]; then
            REV="${EXISTING}"
            PUBLISH=false
          else
            REV=1
            PUBLISH=true
          fi
          BUNDLE="${BUNDLE_PREFIX}-${VERSION}-${REV}.flatpak"
          ARTIFACT="${APP_DIR}-ostree-repo"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\nversion=%s\nrevision=%s\nbundle=%s\nartifact_name=%s\n' \
            "${PUBLISH}" "${VERSION}" "${REV}" "${BUNDLE}" "${ARTIFACT}" > build-result.txt

      - name: Build Flatpak OSTree repository
        if: steps.version.outputs.publish == 'true'
        env:
          APP_DIR: ${{ inputs.app_dir }}
        run: |
          ./${APP_DIR}/build-flatpak.sh --no-bundle
          flatpak build-update-repo "${APP_DIR}/repo" \
            --title='willowypanda-custom-flathub' \
            --comment='Custom Flatpak repository' \
            --gpg-sign="${FLATPAK_GPG_KEY_ID}"
          test -s "${APP_DIR}/repo/summary"

      - name: Create Git tag
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ inputs.tag_prefix }}-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.revision }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag already exists"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release and upload bundle
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_prefix }}-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.revision }}
          BUNDLE: ${{ steps.version.outputs.bundle }}
          APP_DIR: ${{ inputs.app_dir }}
          APP_ID: ${{ inputs.app_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          timeout 30m flatpak build-bundle --gpg-sign="${FLATPAK_GPG_KEY_ID}" "${APP_DIR}/repo" "${BUNDLE}" "${APP_ID}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${BUNDLE}" --clobber
          else
            gh release create "${TAG}" "${BUNDLE}" --title "${APP_NAME} ${{ steps.version.outputs.version }} (pkg ${{ steps.version.outputs.revision }})" --generate-notes
          fi

      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}-result
          path: build-result.txt
          retention-days: 3

      - name: Upload application OSTree repository
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ inputs.app_dir }}/repo
          retention-days: 3
          if-no-files-found: error
